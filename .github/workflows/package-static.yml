name: Package standalone binaries

on:
  push:
    branches: [builds]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/package-platforms.yml
    with:
      source_sha: ${{ github.sha }}
