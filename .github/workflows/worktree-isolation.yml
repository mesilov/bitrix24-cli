name: Worktree isolation

on:
  pull_request:
    branches: [dev, main]
    paths:
      - Makefile
      - docker-compose.yaml
      - docker/**
      - composer.*
      - scripts/**
      - tests/**
      - .gitignore
      - .github/workflows/worktree-isolation.yml
  push:
    branches: [dev, 'feature/**', 'bugfix/**']
    paths:
      - Makefile
      - docker-compose.yaml
      - docker/**
      - composer.*
      - scripts/**
      - tests/**
      - .gitignore
      - .github/workflows/worktree-isolation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worktree-isolation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check concurrent worktrees
        run: make test-worktree
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worktree-isolation-linux
          path: .worktree-test-results/
          include-hidden-files: true
