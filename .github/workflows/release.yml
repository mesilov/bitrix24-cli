name: Release standalone binaries

on:
  push:
    tags: ['*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  packages:
    uses: ./.github/workflows/package-platforms.yml
    with:
      source_sha: ${{ github.sha }}
      release_version: ${{ github.ref_name }}

  publish:
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: b24cli-release-assets
          path: assets
      - name: Verify archives before publication
        run: python3 build/tests/archive-check.py assets
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" assets/* --verify-tag --draft \
            --title "$RELEASE_TAG" --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false --latest
