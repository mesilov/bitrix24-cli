name: Command tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  config-schema:
    name: Configuration schema contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - run: python -m pip install jsonschema==4.25.1
      - run: python build/tests/config-schema-check.py

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export container user
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: make docker-build
      - run: make composer-install
      - run: make check
      - run: make unit
      - run: python3 build/tests/compose-connection-check.py
